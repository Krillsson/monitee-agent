query FileBrowserRoots {
    fileBrowser {
        enabled
        access
        limits {
            maxEditableBytes
            maxUploadBytes
            maxLogViewBytes
            searchTimeoutSeconds
            thumbnails
            maxThumbnailSourceBytes
            maxArchiveEntries
            maxArchiveBytes
            fileOperationRetentionMinutes
        }
        roots {
            name
            path
        }
    }
}

query ListDirectory {
    fileBrowser {
        listDirectory(path: "/storage") {
            truncated
            entries {
                name
                path
                type
                sizeBytes
                updatedAt
                mimeType
                iconId
                editable
                openableAsLog
                isArchive
                hasThumbnail
                isHidden
                permissions
                owner
                group
                accessedAt
                linkTarget
            }
        }
    }
}

# For a directory with more entries than listDirectory returns, page through it instead.
# Pass pageInfo.endCursor back as after until hasNextPage is false
query ListDirectoryConnection {
    fileBrowser {
        listDirectoryConnection(path: "/storage/media", first: 200, after: null) {
            totalCount
            pageInfo {
                hasNextPage
                endCursor
            }
            edges {
                cursor
                node {
                    name
                    path
                    type
                }
            }
        }
    }
}

query Search {
    fileBrowser {
        search(input: { path: "/storage", query: "holiday", maxResults: 500, maxDepth: 16 }) {
            truncated
            durationMillis
            entries {
                name
                path
                type
            }
        }
    }
}

query DirectorySize {
    fileBrowser {
        directorySize(path: "/storage/media") {
            totalBytes
            fileCount
            directoryCount
            truncated
        }
    }
}

# Looking inside a zip does not unpack it, and works in READ mode.
# Leave entryPath out for the top of the archive
query ListArchive {
    fileBrowser {
        listArchive(path: "/storage/bundle.zip", entryPath: "photos") {
            entryPath
            truncated
            entry {
                name
                sizeBytes
            }
            entries {
                name
                entryPath
                type
                sizeBytes
                compressedBytes
                updatedAt
                mimeType
                iconId
            }
        }
    }
}

query Trash {
    fileBrowser {
        trashEnabled
        trash {
            id
            originalPath
            deletedAt
            root
            entry {
                name
                sizeBytes
            }
        }
    }
}

query OpenTextFile {
    fileBrowser {
        openTextFile(path: "/storage/notes.txt") {
            contents
        }
    }
}

mutation SaveTextFile {
    saveTextFile(input: { path: "/storage/notes.txt", contents: "the new contents" }) {
        success
        reason
        errorType
    }
}

# Copy, move, delete and the archive mutations start an operation and answer straight away.
# Follow it with the fileOperationProgress subscription below, or read it back with
# fileBrowser.fileOperation. success is false only when the request was refused outright,
# which is where a destination the agent cannot write to, and a copy that will not fit on
# the volume it is going to, come back as PERMISSION_DENIED and OUT_OF_SPACE
mutation MoveFile {
    moveFile(input: { source: "/storage/notes.txt", destination: "/storage/archive/notes.txt", overwrite: false }) {
        success
        reason
        errorType
        operation {
            id
            state
        }
    }
}

subscription FileOperationProgress {
    fileOperationProgress(id: "3c98243a-4dd7-40ed-9abc-ec7981d79897") {
        id
        type
        state
        currentPath
        processedFiles
        totalFiles
        processedBytes
        totalBytes
        bytesPerSecond
        successes
        failures {
            path
            reason
            type
        }
        reason
        errorType
        finishedAt
    }
}

query FileOperations {
    fileBrowser {
        fileOperations {
            id
            type
            state
            paths
            destination
            startedAt
            finishedAt
            processedFiles
            totalFiles
        }
    }
}

mutation CancelFileOperation {
    cancelFileOperation(input: { id: "3c98243a-4dd7-40ed-9abc-ec7981d79897" }) {
        success
        reason
        errorType
        operation {
            state
        }
    }
}

# A batch is not undone when one path fails, so read both lists. It only ends up FAILED
# when none of its paths worked, or when the volume filled up and the rest were given up on
mutation CopyFiles {
    copyFiles(
        input: {
            sources: ["/storage/one.jpg", "/storage/two.jpg"]
            destinationDirectory: "/storage/archive"
            overwrite: false
        }
    ) {
        success
        reason
        operation {
            id
        }
    }
}

mutation ExtractArchive {
    extractArchive(
        input: {
            path: "/storage/bundle.zip"
            destinationDirectory: "/storage/archive"
            overwrite: false
            entries: ["photos"]
        }
    ) {
        success
        reason
        operation {
            id
        }
    }
}

mutation CreateArchive {
    createArchive(
        input: { sources: ["/storage/media"], destination: "/storage/media.zip", overwrite: false }
    ) {
        success
        reason
        operation {
            id
        }
    }
}

mutation MoveToTrash {
    moveToTrash(input: { path: "/storage/notes.txt" }) {
        success
        reason
        entry {
            id
            originalPath
        }
    }
}

mutation RestoreFromTrash {
    restoreFromTrash(input: { id: "3c98243a-4dd7-40ed-9abc-ec7981d79897", overwrite: false }) {
        success
        reason
        entry {
            path
        }
    }
}

mutation EmptyTrash {
    emptyTrash(input: { id: null }) {
        success
        reason
        operation {
            id
        }
    }
}

mutation DeleteFile {
    deleteFile(input: { path: "/storage/archive", recursive: true }) {
        success
        reason
    }
}

mutation CreateDirectory {
    createDirectory(input: { path: "/storage/archive" }) {
        success
        reason
        entry {
            path
        }
    }
}

# Downloading and uploading are HTTP, with the same credentials as the GraphQL API:
#
#   GET  /files/download?path=/storage/media/movie.mkv
#   POST /files/upload?directory=/storage/media&name=photo.jpg&overwrite=false
#        Content-Type: application/octet-stream, the file itself as the body
#   GET  /files/icons/{iconId}.svg
#   GET  /files/thumbnail?path=/storage/photos/holiday.jpg&size=256
#   GET  /files/archive/download?path=/storage/bundle.zip&entry=photos/one.jpg
