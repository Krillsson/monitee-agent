name: Build Docker images
run-name: Build and push the docker image to Docker Hub and draft a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 1.2.3)'
        required: true
        type: string
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit
  create-release:
    name: Create GitHub Draft Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Extract changelog for version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          ESCAPED_TAG=$(echo "$TAG" | sed 's/\./\\./g')
          awk "/^### ${ESCAPED_TAG}\$/{found=1; next} found && /^### /{exit} found{print}" CHANGES.md > release-notes.md
      - name: Download shadow-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-dist
          path: staging/shadow/
      - name: Download debian package artifact
        uses: actions/download-artifact@v4
        with:
          name: sys-api-debian-package
          path: staging/deb/
      - name: Download windows setup artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: staging/win/
      - name: Collect and rename artifacts
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          mkdir -p release-artifacts
          mv staging/shadow/*.zip "release-artifacts/sysapi-shadow-${TAG}.zip"
          mv staging/deb/*.deb release-artifacts/
          mv staging/win/*.exe release-artifacts/
      - name: Create draft release
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file release-notes.md \
            "release-artifacts/sysapi-shadow-${TAG}.zip" \
            release-artifacts/*.deb \
            release-artifacts/*.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
