name: Build nightly Docker images
run-name: Build and push nightly native and jvm images to Docker Hub

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
jobs:
  build-docker:
    name: Build nightly sys-API docker image
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          cache: 'gradle'
          set-java-home: 'true'
          native-image-job-reports: 'true'
      - name: Upload JVM build to Docker Hub
        run: ./gradlew jibJvm
  build-deb:
    name: Build sys-API deb package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          cache: 'gradle'
          set-java-home: 'true'
          native-image-job-reports: 'true'
      - name: Build .deb
        run: ./gradlew packageDeb
      - name: Store .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: sys-api-debian-package
          path: build/distributions/*.deb
  build-cmd:
    name: Build sys-API command line .zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          cache: 'gradle'
          set-java-home: 'true'
          native-image-job-reports: 'true'
      - name: Build shadowJar
        run: ./gradlew shadowDistZip
      - name: Store distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-dist
          path: build/distributions/*.zip
  build-win:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: inno-setup-download
        uses: ./.github/actions/inno-setup-download
      - name: Set Up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Build Windows installer
        run: ./gradlew packageWindowsInstaller
      - name: Store setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: build/*.exe
  build-docker-native:
    name: Build GraalVM sys-API nightly distribution (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@v4
      # Gradle 8.8 cannot compile a Groovy build script on JDK 25, so the daemon
      # stays on 21 and only native-image runs on GraalVM 25 via GRAALVM_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          set-java-home: 'false'
          native-image-job-reports: 'true'
      - name: Install zlib headers for native-image linking
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Upload Graal native build to Docker Hub
        run: ./gradlew jibNativeImage -PimageArch=${{ matrix.arch }}
      - name: Store native image artifact
        uses: actions/upload-artifact@v4
        with:
          name: sys-api-native-image-${{ matrix.arch }}
          path: build/native/nativeCompile/sysapi
  publish-native-manifest:
    name: Publish multi-arch native image manifest
    runs-on: ubuntu-latest
    needs: build-docker-native
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Combine per-architecture images into one manifest
        run: |
          docker buildx imagetools create \
            --tag krillsson/sys-api:native-nightly \
            krillsson/sys-api:native-nightly-amd64 \
            krillsson/sys-api:native-nightly-arm64
