#########################################
### sys-API user configuration        ###
#########################################
metricsConfig:
  monitor:
    interval: 45
    unit: SECONDS
  history:
    interval: 30
    unit: MINUTES
    purging:
      olderThan: 14
      unit: DAYS
      purgeEvery: 1
      purgeEveryUnit: DAYS
    # Check results are rolled up into hourly and daily buckets once an hour.
    # Each tier is kept for as long as it says here, the purging section above does not apply to them
    checks:
      raw:
        olderThan: 48
        unit: HOURS
      hourly:
        olderThan: 90
        unit: DAYS
      daily:
        olderThan: 730
        unit: DAYS
  cache:
    enabled: true
    duration: 5
    unit: SECONDS
user:
  username: user
  password: password
processes:
  # disable to release some RAM
  enabled: true
windows:
  enableOhmJniWrapper: true
  eventLog:
    enabled: true
  serviceManagement:
    enabled: true
linux:
  # Incorrect CPU temp on Linux? Look for log output of LinuxSensorDiscovery
  # and put the identifier below (default on intel systems is thermal:x86_pkg_temp)
  # overrideCpuTempSensor: hwmon:coretemp
  journalLogs:
    enabled: true
  systemDaemonServiceManagement:
    enabled: true
logReader:
  files: [ ]
  directories:
  # - data # sys-API data directory. You can enable log to file in application.properties
  # - /var/log # Linux log directory
# browse, read and manage files in the directories listed under roots
fileBrowser:
  enabled: false
  # READ or READ_WRITE. READ_WRITE enables editing, upload, copy, move, delete,
  # archives and the trash
  access: READ
  # the directories the browser is allowed inside. Nothing outside of them can be reached.
  # In docker, bind mount a host directory (for example - /mnt/user:/storage) and list the
  # container path here
  roots: [ ]
  # - /storage
  # largest file the text editor will open and save
  maxEditableBytes: 1048576
  # largest accepted upload. 0 means no limit
  maxUploadBytes: 0
  # largest browsed file that can be opened in the log viewer
  maxLogViewBytes: 33554432
  # a .monitee-trash directory inside each root, that moveToTrash puts things in and
  # restoreFromTrash takes them back out of. deleteFile still deletes outright
  trash: true
  # how long a search or a recursive size is allowed to walk before it gives up and says so
  searchTimeoutSeconds: 20
  # serve downscaled images from /files/thumbnail, cached under the data directory
  thumbnails: true
  # largest image a thumbnail is rendered from
  maxThumbnailSourceBytes: 67108864
  # how much of the data directory the thumbnail cache is allowed to fill
  maxThumbnailCacheBytes: 268435456
  # what an archive is allowed to unpack to, which is what makes a zip bomb harmless
  maxArchiveEntries: 100000
  maxArchiveBytes: 21474836480
# docker management and metrics support
ups:
  enabled: false
  # Requires upsc command to be available on host machine
  # Docker image users put their local server IP here
  # Host machine also need to run NUT
  host: "localhost"
  port: 3493
#smart:
#  additionalDeviceFlags:
#    - device: "/dev/sda"
#      flags: "-d sntasmedia"
docker:
  enabled: true
  # keep the interfaces docker makes for itself (docker0, br-<network id>, veth*) out of the
  # network interfaces the agent reports. Set to false to see them everywhere again
  hideContainerNetworks: true
  #  cache:
  #    enabled: true
  #    duration: 2
  #    unit: SECONDS
  # uncomment if you'd like to manually specify docker host
  # host: unix:///var/run/docker.sock or unix:///run/podman/podman.sock
  # compares the digest of every container's image with the one its registry serves
  updateCheck:
    enabled: true
    # set to false to keep detecting updates without sending push notifications
    notify: true
    # DAILY_DIGEST sends one notification a day summing up every outdated container,
    # EVERY_CONTAINER sends one as soon as a container falls behind
    notifyStyle: DAILY_DIGEST
    # hour of the day, local time, the digest goes out
    digestAtHour: 12
    intervalMinutes: 60
    # container names to leave out, * matches any part of a name
    excludeContainers: [ ]
    # credentials for private registries, public images need none
    #    registries:
    #      - host: ghcr.io
    #        username: user
    #        password: token
# resolve external IP and monitor internet connectivity
connectivityCheck:
  enabled: true
  address: https://ifconfig.me
internetServicesCheck:
  enabled: true
  services:
    - address: google.com
      name: Google
      port: 80
    - address: one.one.one.one
      name: Cloudflare
      port: 80
    - address: connectivity.office.com
      name: Microsoft
      port: 80
updateCheck:
  enabled: true
  address: https://api.github.com
  user: krillsson
  repo: monitee-agent
notifications:
  # serverName: MyServer
  ntfy:
    enabled: false
    url: "https://ntfy.sh"
    # topic: my-custom-globally-unique-topic
    # protected topics need either an access token or a username and password
    # token: tk_myaccesstoken
    # username: user
    # password: password
    # notifications are tagged so ntfy shows an emoji for what happened, set to false for no tags
    # emoji: true
  # every notification is posted to each webhook below, alongside ntfy
  # without a body the agent posts its own JSON, see docs/notifications.md
  # titles and messages are prefixed with an emoji, turn it off per webhook with emoji: false
  webhooks: [ ]
  #  - name: Gotify
  #    url: "https://gotify.example.com/message?token=APP_TOKEN"
  #    body: '{"title": "{{title}}", "message": "{{message}}", "priority": {{priority}}}'
  #  - name: Discord
  #    url: "https://discord.com/api/webhooks/ID/TOKEN"
  #    body: '{"content": "**{{title}}**\n{{message}}\n{{clickUrl}}"}'
# publish metrics and notifications to an MQTT broker, see docs/home-assistant.md
mqtt:
  enabled: false
  # url: "tcp://192.168.0.10:1883"
  # username: mqtt
  # password: password
  # topicPrefix: monitee
  # intervalSeconds: 30
  # a binary sensor per container, off because a busy host has a lot of them
  # containers: false
  # link state and rates per network interface, discovered disabled so they stay out of the way
  # networkInterfaces: true
  homeAssistant:
    # announce every entity to Home Assistant, which makes the server show up as a device
    enabled: true
    # discoveryPrefix: homeassistant
# advertise service in local network for easier client setup
mDNS:
  enabled: true
upnp:
  enabled: true
forwardHttpToHttps: false
graphQl:
  # print slow queries and field resolving to the log
  instrumentation: false
# Keep in mind that this feature doesn't work well with proxies
# It doesn't work domain names either
# I recommend terminating the SSL in a proxy instead, or a cloudflare tunnel
selfSignedCertificates:
  enabled: true
  ## automatically put external IP in CN
  populateCN: true
  ## automatically put internal IPs in SAN
  populateSAN: true
  ## manually populate CN and SAN below (only supports IPs)
  # commonName: 95.168.0.24
  # subjectAlternativeNames: [192.168.0.24, 10.8.0.24]
formatting:
  ## possible values are celsius, fahrenheit or system (reads locale on the system)
  ## note that this only affects presentation and not the API. Currently only notifications.
  temperatureUnit: system